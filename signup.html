<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Samrat Fast</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #10b981; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        .btn-reg { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 10px; }
        .btn-reg:disabled { background: #444; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color:#10b981; margin-top:0;">📝 Create Account</h2>
    <p style="font-size:12px; color:#94a3b8; margin-bottom:20px;">Details bhariye aur khelna shuru karein</p>
    
    <input type="text" id="userName" placeholder="Apna Naam">
    <input type="text" id="userPhone" placeholder="Mobile Number">
    <input type="password" id="userPass" placeholder="Password Set Karein">
    
    <!-- Function ka naam 'reg' hi rakha hai taaki error na aaye -->
    <button class="btn-reg" id="mainBtn" onclick="reg()">CREATE ACCOUNT & PLAY</button>
    
    <p style="font-size: 13px; margin-top: 15px;">Pehle se account hai? <a href="login.html" style="color:#fbbf24;">Login Karein</a></p>
</div>

<script>
    // --- APKI FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
        authDomain: "number-samrat.firebaseapp.com",
        projectId: "number-samrat",
        storageBucket: "number-samrat.firebasestorage.app",
        messagingSenderId: "154722781783",
        appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
    };

    // Firebase Initialize
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ASLI FUNCTION
    async function reg() {
        const name = document.getElementById("userName").value.trim();
        const phone = document.getElementById("userPhone").value.trim();
        const pass = document.getElementById("userPass").value.trim();
        const btn = document.getElementById("mainBtn");

        if(!name || !phone || !pass) {
            alert("Bhai saari details bharo!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            // 1. Check if phone already exists
            const check = await db.collection("users").where("phone", "==", phone).get();
            if(!check.empty) {
                alert("Bhai ye number pehle se register hai!");
                btn.disabled = false;
                btn.innerText = "CREATE ACCOUNT & PLAY";
                return;
            }

            // 2. Add to Firestore
            await db.collection("users").add({
                name: name,
                phone: phone,
                password: pass,
                wallet: 0,
                status: "active",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("Mubarak ho! Account ban gaya. Ab Login karein.");
            window.location.href = "login.html";

        } catch (error) {
            alert("Database Error: " + error.message);
            btn.disabled = false;
            btn.innerText = "CREATE ACCOUNT & PLAY";
        }
    }
</script>

</body>
</html>
