[19:53, 08/08/2026] +91 7428 919 416: <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Samrat Fast ⚡</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h2 { color: #fbbf24; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0a0f1e; color: white; box-sizing: border-box; font-size: 1rem; }
        .btn-reg { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .login-link { margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .login-link a { color: #fbbf24; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Samrat Fast ⚡</h2>
    <p>Naya Account Banayein aur Khelna Shuru Karein</p>
    
    <input type="text" id="name" placeholder="Apna Poora Naam">
    <input type="text" id="phone" placeholder="Mobile Number (Login ID)">
    <input type="password" id="pass" placeholder="Password Set Karein">
    
    <!-- Isme Agent Code ki zaroorat nahi hai kyunki ye Direct Game hai -->
    
    <button class="btn-reg" onclick="register()">CREATE ACCOUNT & PLAY</button>
    
    <div class="login-link">
        Pehle se account hai? <a href="game.html">Login Karein</a>
    </div>
</div>

<script>
    // --- NAYE PROJECT (Samrat Fast) KI CONFIG YAHAN DALO ---
    const firebaseConfig = {
        apiKey: "PASTE_YOUR_NEW_API_KEY",
        authDomain: "samrat-fast.firebaseapp.com",
        projectId: "samrat-fast",
        storageBucket: "samrat-fast.firebasestorage.app",
        messagingSenderId: "...",
        appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function register() {
        const n = document.getElementById("name").value.trim();
        const p = document.getElementById("phone").value.trim();
        const pw = document.getElementById("pass").value.trim();

        if(!n || !p || !pw) return alert("Bhai saari details bharo!");

        // Check karo ki number pehle se toh nahi hai
        const check = await db.collection("users").where("phone", "==", p).get();
        if(!check.empty) return alert("Bhai ye number pehle se register hai!");

        // Firebase mein naya user dalo
        await db.collection("users").add({
            name: n,
            phone: p,
            password: pw,
            wallet: 0, // Naya user = 0 balance
            status: "active",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert("Mubarak ho! Account ban gaya. Ab login karke paise add karein.");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
