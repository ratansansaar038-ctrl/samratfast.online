<!DOCTYPE html>
<html>
<head>
    <title>Signup - Samrat Fast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body style="font-family: Arial; background: #0f172a; color: white; text-align: center; padding-top: 50px;">
<div style="background: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #10b981; width: 90%; max-width: 350px; display: inline-block;">
    <h2 style="color:#10b981;">📝 Samrat Fast Signup</h2>
    <input type="text" id="name" placeholder="Naam" style="width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none;">
    <input type="text" id="phone" placeholder="Mobile Number" style="width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none;">
    <input type="password" id="pass" placeholder="Password" style="width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none;">
    <button onclick="register()" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">CREATE ACCOUNT</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    async function register() {
        const n = document.getElementById("name").value.trim();
        const p = document.getElementById("phone").value.trim();
        const pw = document.getElementById("pass").value.trim();
        if(!n || !p || !pw) return alert("Bhai saari details bharo!");

        try {
            // NAYA FOLDER: users_fast
            const check = await db.collection("users_fast").where("phone", "==", p).get();
            if(!check.empty) return alert("Ye number Samrat Fast mein pehle se hai!");

            await db.collection("users_fast").add({
                name: n, phone: p, password: pw, wallet: 0, status: "active", createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Samrat Fast Account Ban Gaya! Login Karein.");
            window.location.href = "login.html";
        } catch(e) { alert("Error: " + e.message); }
    }
</script>
</body>
</html>
