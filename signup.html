<!DOCTYPE html>
<html>
<head>
    <title>Signup - Samrat Fast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e293b; padding: 30px; border-radius: 20px; border: 2px solid #10b981; width: 90%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn-reg { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="color:#10b981;">📝 Create Account</h2>
    <input type="text" id="n" placeholder="Apna Naam">
    <input type="text" id="p" placeholder="Mobile Number">
    <input type="password" id="pw" placeholder="Password Set Karein">
    <button class="btn-reg" onclick="reg()">CREATE ACCOUNT & PLAY</button>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", 
        authDomain: "number-samrat.firebaseapp.com", 
        projectId: "number-samrat", 
        storageBucket: "number-samrat.firebasestorage.app", 
        messagingSenderId: "154722781783", 
        appId: "1:154722781783:web:7b6136cec1c34a11b3f112" 
    };

    try {
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        async function reg() {
            const name = document.getElementById("n").value.trim();
            const phone = document.getElementById("p").value.trim();
            const pass = document.getElementById("pw").value.trim();

            if(!name || !phone || !pass) {
                alert("Bhai saari details bharo!");
                return;
            }

            alert("Checking Database..."); // DEBUG ALERT 1

            try {
                // Check if already exists
                const check = await db.collection("users").where("phone", "==", phone).get();
                
                if(!check.empty) {
                    alert("Ye number pehle se register hai!");
                    return;
                }

                alert("Saving User..."); // DEBUG ALERT 2

                // Add User
                await db.collection("users").add({
                    name: name,
                    phone: phone,
                    password: pass,
                    wallet: 0,
                    status: "active"
                });

                alert("Success! Account ban gaya.");
                window.location.href = "login.html";

            } catch (e) {
                alert("Firebase Galti: " + e.message);
                console.error(e);
            }
        }
    } catch (err) {
        alert("Config Galti: " + err.message);
    }
</script>
</body>
</html>
