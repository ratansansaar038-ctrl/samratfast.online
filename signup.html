<!DOCTYPE html>
<html>
<head>
    <title>Register - Samrat Fast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body style="font-family: Arial; background: #f0f2f5; text-align: center; padding-top: 50px;">
<div style="background: white; padding: 30px; border-radius: 15px; display: inline-block; width: 90%; max-width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color:#10b981;">Create Account</h2>
    <input type="text" id="n" placeholder="Name" style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px;">
    <input type="text" id="p" placeholder="Phone" style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px;">
    <input type="password" id="pw" placeholder="Password" style="width:100%; padding:10px; margin:5px 0; border:1px solid #ddd; border-radius:5px;">
    <button onclick="reg()" style="width:100%; padding:12px; background:#10b981; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">REGISTER</button>
</div>
<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function reg() {
        const n = document.getElementById("n").value;
        const p = document.getElementById("p").value;
        const pw = document.getElementById("pw").value;
        if(!n || !p || !pw) return alert("Fill all fields!");
        await db.collection("users").add({ name: n, phone: p, password: pw, wallet: 0, status: "active" });
        alert("Success! Now Login.");
        // SIGNUP KE BAAD LOGIN PAGE PAR BHEJEGA
        window.location.href = "login.html";
    }
</script>
</body>
</html>
