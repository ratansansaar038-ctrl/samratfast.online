<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samrat Fast - 1 Min Game</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0f1e; color: white; text-align: center; margin: 0; }
        .header { background: #1e293b; padding: 15px; border-bottom: 2px solid #fbbf24; display: flex; justify-content: space-between; align-items: center; }
        .balance-card { background: white; color: #000; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .timer-box { font-size: 3.5rem; font-weight: bold; color: #fbbf24; margin: 15px 0; }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; max-width: 450px; margin: 0 auto; }
        .num-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 15px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
        .num-btn.active { background: #fbbf24; color: black; font-weight: bold; transform: scale(1.1); }
        .btn-bet { background: #22c55e; color: white; padding: 15px; width: 85%; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .recharge-section { background: #1e293b; margin: 20px; padding: 20px; border-radius: 15px; border: 1px dashed #fbbf24; text-align: left; }
    </style>
</head>
<body>

    <div class="header">
        <span id="uName">Loading...</span>
        <button onclick="localStorage.clear(); location.href='login.html'" style="background:red; color:white; border:none; padding:5px 10px; border-radius:5px;">Logout</button>
    </div>

    <div class="balance-card">
        <small style="color: #64748b;">Available Balance</small>
        <h2 style="margin:0; font-size: 2rem; color: #059669;">₹<span id="bal">0</span></h2>
        <!-- Zypora Link -->
        <a href="https://zyporapay.com/pay/YOUR_ID" id="auto-pay" style="display:block; background:#fbbf24; color:#000; text-decoration:none; padding:10px; border-radius:10px; margin-top:10px; font-weight:bold;">Automatic Recharge (₹200+)</a>
    </div>

    <div class="recharge-section">
        <h4 style="margin:0 0 10px 0; color:#fbbf24;">Chota Recharge (₹10 - ₹199)</h4>
        <p style="font-size:13px; margin:5px 0;">UPI ID: <b style="color:#00d2ff;">gaurav@upi</b></p>
        <input type="number" id="m-amt" placeholder="Amount ₹" style="width:70px; padding:8px; border-radius:5px; border:none;">
        <input type="text" id="m-utr" placeholder="UTR/Ref No." style="width:130px; padding:8px; border-radius:5px; border:none;">
        <button onclick="sendRequest()" style="background:#10b981; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">Submit</button>
    </div>

    <div class="timer" id="timer">60</div>
    <p style="color: #94a3b8; margin-top:-10px;">Seconds Remaining</p>

    <div class="num-grid" id="number-buttons">
        <!-- Buttons 0-9 generated by script -->
    </div>

    <input type="number" id="bet-amt" placeholder="Amount (₹)" style="width:80%; padding:15px; border-radius:10px; border:none; font-size:1.1rem; margin:10px 0;">
    <button class="btn-bet" onclick="placeBet()">CONFIRM BET ✅</button>

<script>
    // --- FIREBASE CONFIG (Number Samrat Wali Asli Config) ---
    const firebaseConfig = {
        apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw",
        authDomain: "number-samrat.firebaseapp.com",
        projectId: "number-samrat",
        storageBucket: "number-samrat.firebasestorage.app",
        messagingSenderId: "154722781783",
        appId: "1:154722781783:web:7b6136cec1c34a11b3f112"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = localStorage.getItem("userId_fast");
    if(!userId) window.location.href = "login.html";

    // Number Buttons generate karna
    const grid = document.getElementById('number-buttons');
    for(let i=0; i<=9; i++) {
        grid.innerHTML += <button class="num-btn" onclick="selectN(${i}, this)">${i}</button>;
    }

    let sel = null;
    function selectN(n, btn) {
        sel = n;
        document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // Live Balance (Purane users folder se hi uthayega)
    db.collection("users").doc(userId).onSnapshot(doc => {
        if(doc.exists) {
            document.getElementById("bal").innerText = doc.data().wallet;
            document.getElementById("uName").innerText = "Welcome, " + doc.data().name;
        }
    });

    // 1-Min Global Timer
    setInterval(() => {
        let seconds = new Date().getSeconds();
        document.getElementById("timer").innerText = 60 - seconds;
    }, 1000);

    // Chota Recharge Request
    async function sendRequest() {
        const a = document.getElementById("m-amt").value;
        const u = document.getElementById("m-utr").value;
        if(!a || !u) return alert("Details bharo!");
        await db.collection("fast_recharge_requests").add({ userId, amount: parseInt(a), utr: u, status: "pending", timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        alert("Request Sent!");
    }

    // Bet logic (FAST_BETS FOLDER MEIN JAYEGA)
    async function placeBet() {
        const a = parseInt(document.getElementById("bet-amt").value);
        if(sel === null || isNaN(a) || a < 10) return alert("Sahi details dalo!");
        const userRef = db.collection("users").doc(userId);
        const uDoc = await userRef.get();
        if(uDoc.data().wallet < a) return alert("Balance Low!");

        await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-a) });
        await db.collection("fast_bets").add({
            userId: userId,
            number: sel,
            amount: a,
            status: "pending",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Bet Lag Gayi!");
    }
</script>
</body>
</html>
