<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samrat Fast - Game Zone</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0f1e; color: white; text-align: center; margin: 0; }
        .header { background: #1e293b; padding: 15px; border-bottom: 2px solid #fbbf24; display: flex; justify-content: space-between; align-items: center; }
        .balance-card { background: white; color: #000; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .timer { font-size: 3rem; font-weight: bold; color: #fbbf24; margin: 10px 0; }
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; }
        .num-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 15px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
        .num-btn.active { background: #fbbf24; color: black; font-weight: bold; }
        .btn-pay { background: #22c55e; color: white; padding: 15px; width: 85%; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <span id="uName">Loading...</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="balance-card">
        <small>Wallet Balance</small>
        <h2 style="margin:0; color: #059669;">₹<span id="bal">0</span></h2>
        <!-- ZYPORAPAY BUTTON -->
        <a href="#" id="recharge-btn" style="display:block; background:#fbbf24; color:#000; text-decoration:none; padding:10px; border-radius:10px; margin-top:10px; font-weight:bold;">➕ RECHARGE (₹200+)</a>
    </div>

    <div class="timer" id="timer">60</div>
    <p style="color: #94a3b8;">Seconds Remaining</p>

    <div class="num-grid" id="grid">
        <!-- Buttons 0-9 auto generate -->
    </div>

    <input type="number" id="amt" placeholder="Enter Amount ₹" style="width:80%; padding:15px; border-radius:10px; border:none; margin-bottom:10px;">
    <button class="btn-pay" onclick="placeBet()">CONFIRM BET ✅</button>

<script>
    const firebaseConfig = { apiKey: "AIzaSyD_Da_doRKedyGEVjZemzP9Gq6VIPfokhw", authDomain: "number-samrat.firebaseapp.com", projectId: "number-samrat", storageBucket: "number-samrat.firebasestorage.app", messagingSenderId: "154722781783", appId: "1:154722781783:web:7b6136cec1c34a11b3f112" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const userId = localStorage.getItem("userId_fast");
    if(!userId) window.location.href = "login.html";

    // 1. Load User Data & Wallet
    db.collection("users_fast").doc(userId).onSnapshot(doc => {
        if(doc.exists) {
            const data = doc.data();
            document.getElementById("bal").innerText = data.wallet;
            document.getElementById("uName").innerText = "Namaste, " + data.name;
            // Recharge Link
            document.getElementById("recharge-btn").href = "https://zyporapay.com/pay/YOUR_ID&remark=" + userId;
        }
    });

    // 2. Grid Buttons
    const grid = document.getElementById('grid');
    let sel = null;
    for(let i=0; i<=9; i++) {
        grid.innerHTML += <button class="num-btn" onclick="selectN(${i}, this)">${i}</button>;
    }
    function selectN(n, btn) {
        sel = n;
        document.querySelectorAll('.num-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
    }

    // 3. Timer
    setInterval(() => {
        let s = 60 - new Date().getSeconds();
        document.getElementById("timer").innerText = s;
    }, 1000);

    // 4. Bet Place
    async function placeBet() {
        const a = parseInt(document.getElementById("amt").value);
        if(sel === null || isNaN(a) || a < 10) return alert("Details check karein!");

        const userRef = db.collection("users_fast").doc(userId);
        const uDoc = await userRef.get();
        if(uDoc.data().wallet < a) return alert("Balance kam hai!");

        await userRef.update({ wallet: firebase.firestore.FieldValue.increment(-a) });
        await db.collection("fast_bets").add({
            userId, number: sel, amount: a, status: "pending", timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Bet Lag Gayi!");
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
</script>
</body>
</html>
